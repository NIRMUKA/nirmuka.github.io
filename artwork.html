<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIRMUKA | Artwork</title>

<link rel="stylesheet" href="/style.css?v=20260822">

</head>


<body>


<div class="curtain"></div>


<main class="artwork-page">

<div class="artwork-container">


<a
href="/"
class="back-button"
id="artwork-back"
>
← BACK TO WORKS
</a>


<div class="artwork-image">

<img

id="art-image"

src=""

alt="Artwork"

draggable="false"

>

</div>



<div class="artwork-info">


<p
class="work-number"
id="art-id"
>
WORK
</p>



<h1 id="art-title">
Loading...
</h1>



<div class="meta">


<div>

<strong>
YEAR
</strong>

<span id="art-year">
—
</span>

</div>



<div>

<strong>
MEDIUM
</strong>

<span id="art-medium">
—
</span>

</div>



<div>

<strong>
DIMENSION
</strong>

<span id="art-dimension">
—
</span>

</div>


</div>





<div class="description-block">


<h2>
BACKGROUND
</h2>

<p id="art-background"></p>



<h2>
CONCEPT
</h2>

<p id="art-concept"></p>



<h2>
VISUAL DESCRIPTION
</h2>

<p id="art-visual"></p>



<h2>
ARTIST STATEMENT
</h2>

<p id="art-statement"></p>



<h2>
INSPIRATION
</h2>

<p id="art-inspiration"></p>



<h2>
CREATIVE PROCESS
</h2>

<p id="art-process"></p>


</div>


</div>


</div>


</main>






<script>


(function(){



const id =

new URLSearchParams(
window.location.search
)
.get("id");



if(!id){

console.error(
"No artwork ID"
);

return;

}




fetch(
"/artworks.json?v=999"
)


.then(
response=>{


if(!response.ok){

throw new Error(
"Cannot load artworks.json"
);

}


return response.text();


}

)



.then(
text=>{


let artworks;


try{


artworks =
JSON.parse(text);


}

catch(error){


console.error(
"BROKEN JSON:",
error
);


document.getElementById(
"art-title"
).textContent =
"JSON ERROR";


throw error;


}



console.log(
"NIRMUKA DATABASE:",
artworks.length,
"works"
);



if(!Array.isArray(artworks)){


throw new Error(
"Invalid artwork format"
);


}



return artworks;


}

)



.then(
artworks=>{


const artwork =

artworks.find(

item=>

item.id === id

);



if(!artwork){


console.error(
"Artwork not found:",
id
);


return;


}




document.title =

artwork.title
+
" | NIRMUKA";





/* IMAGE */


const image =

document.getElementById(
"art-image"
);



image.src =

artwork.image.startsWith("/")

?

artwork.image

:

"/"+artwork.image;



image.alt =

artwork.title;







/* META */


set(
"art-id",
"WORK "
+
id.replace("karya","").padStart(2,"0")
);



set(
"art-title",
artwork.title
);



set(
"art-year",
artwork.year
);



set(
"art-medium",
artwork.medium
);



set(
"art-dimension",
artwork.dimension
);






/* DESCRIPTION */


set(
"art-background",
artwork.background
);



set(
"art-concept",
artwork.concept
);



set(
"art-visual",
artwork.visual_description
);



set(
"art-statement",
artwork.artist_statement
);



set(
"art-inspiration",
artwork.inspiration
);



set(
"art-process",
artwork.creative_process
);



}

)



.catch(

error=>{


console.error(
"NIRMUKA ERROR:",
error
);


}

);






function set(
id,
value
){


const el =

document.getElementById(id);



if(el){


el.textContent =
value || "";


}


}



})();


</script>






<!-- VISUAL ENGINE -->

<script src="/spray.js?v=1"></script>



<!-- ART PROTECTION -->

<script src="/protection.js?v=1"></script>






<script>


const back =

document.getElementById(
"artwork-back"
);



if(back){


back.onclick=function(e){


if(

document.referrer.includes(
location.hostname
)

){


e.preventDefault();


history.back();


}


}


}



</script>



</body>

</html>
