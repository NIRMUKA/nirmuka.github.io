<!DOCTYPE html>
<html lang="en">


<head>


<meta charset="UTF-8">


<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>


<title>
NIRMUKA | Artwork
</title>



<link
rel="stylesheet"
href="/style.css?v=3"
/>



</head>




<body>



<!-- =====================================
     CURTAIN
===================================== -->


<div class="curtain"></div>







<!-- =====================================
     ARTWORK DETAIL
===================================== -->


<main
class="artwork-detail-page"
>



<div
class="artwork-container"
>





<a
href="/index.html"
class="back-home"
>

← BACK TO ARCHIVE

</a>







<div
class="artwork-image-container"
>



<img
id="art-image"
class="artwork-image"
src=""
alt=""
draggable="false"
/>



</div>







<div
class="artwork-information"
>



<p
class="work-number"
>

ARTWORK / DETAIL

</p>





<h1
id="art-title"
>

</h1>





<p
id="art-year"
>

</p>






<p
id="art-description"
>

</p>






</div>






</div>



</main>









<!-- =====================================
     DATA LOADER
===================================== -->


<script>


(async function(){



const params =
new URLSearchParams(
window.location.search
);



const id =
params.get("id");




if(!id){

return;

}





try{


const response =
await fetch(
"/artworks.json?v=3"
);



const artworks =
await response.json();




const artwork =
artworks.find(
item =>
item.id === id
);






if(!artwork){

console.error(
"Artwork tidak ditemukan"
);

return;

}







document
.getElementById(
"art-image"
)
.src =
artwork.image;






document
.getElementById(
"art-image"
)
.alt =
artwork.title;






document
.getElementById(
"art-title"
)
.textContent =
artwork.title || "UNTITLED";





document
.getElementById(
"art-year"
)
.textContent =
artwork.year || "";






document
.getElementById(
"art-description"
)
.textContent =
artwork.description || "";





}
catch(error){


console.error(
error
);


}



})();



</script>









<!-- =====================================
     VISUAL SYSTEM
===================================== -->


<script
src="/spray.js?v=3"
></script>



<script
src="/protection.js?v=3"
></script>



</body>


</html>
