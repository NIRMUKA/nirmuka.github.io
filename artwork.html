<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NIRMUKA | Artwork</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================
     CURTAIN
===================================== -->

<div class="curtain"></div>



<!-- =====================================
     ARTWORK PAGE
===================================== -->

<section class="artwork-page">

    <div class="artwork-container">


        <!-- BACK -->

        <a
            href="index.html"
            class="back-button"
            id="artwork-back"
        >
            ← BACK TO WORKS
        </a>



        <!-- ARTWORK IMAGE -->

        <div class="artwork-image">

            <img
                id="art-image"
                src=""
                alt="Artwork"
            >

        </div>



        <!-- ARTWORK INFORMATION -->

        <div class="artwork-info">


            <p
                class="work-number"
                id="art-id"
            >
                WORK
            </p>


            <h1 id="art-title">
                Loading...
            </h1>



            <!-- META -->

            <div class="meta">


                <div>

                    <strong>
                        YEAR
                    </strong>

                    <span id="art-year"></span>

                </div>



                <div>

                    <strong>
                        MEDIUM
                    </strong>

                    <span id="art-medium"></span>

                </div>



                <div>

                    <strong>
                        DIMENSION
                    </strong>

                    <span id="art-dimension"></span>

                </div>


            </div>



            <!-- DESCRIPTION -->

            <div class="description-block">


                <h2>
                    BACKGROUND
                </h2>

                <p id="art-background"></p>



                <h2>
                    CONCEPT
                </h2>

                <p id="art-concept"></p>



                <h2>
                    VISUAL DESCRIPTION
                </h2>

                <p id="art-visual"></p>



                <h2>
                    ARTIST STATEMENT
                </h2>

                <p id="art-statement"></p>



                <h2>
                    INSPIRATION
                </h2>

                <p id="art-inspiration"></p>



                <h2>
                    CREATIVE PROCESS
                </h2>

                <p id="art-process"></p>


            </div>


        </div>


    </div>

</section>



<!-- =====================================
     LOAD ARTWORK DATA
===================================== -->

<script>

(function () {


    /* =====================================
       GET ARTWORK ID
    ===================================== */

    const parameters =
        new URLSearchParams(
            window.location.search
        );


    const artworkId =
        parameters.get("id");



    /* =====================================
       LOAD DATABASE
    ===================================== */

    fetch("artworks.json")

    .then(response => {


        if (!response.ok) {

            throw new Error(
                "artworks.json could not be loaded."
            );

        }


        return response.json();

    })


    .then(artworks => {


        const artwork =
            artworks.find(
                item =>
                    item.id === artworkId
            );



        /* =====================================
           ARTWORK NOT FOUND
        ===================================== */

        if (!artwork) {


            const container =
                document.querySelector(
                    ".artwork-container"
                );


            container.innerHTML = `

                <a
                    href="index.html"
                    class="back-button"
                >
                    ← BACK
                </a>


                <p class="work-number">
                    ARCHIVE ERROR
                </p>


                <h1 id="art-title">
                    ARTWORK NOT FOUND
                </h1>

            `;


            return;

        }



        /* =====================================
           PAGE TITLE
        ===================================== */

        document.title =
            `${artwork.title} | NIRMUKA`;



        /* =====================================
           IMAGE
        ===================================== */

        const image =
            document.getElementById(
                "art-image"
            );


        image.src =
            artwork.image;


        image.alt =
            artwork.title;



        /* =====================================
           WORK NUMBER
        ===================================== */

        let workNumber =
            artwork.id.replace(
                "karya",
                ""
            );


        workNumber =
            workNumber.padStart(
                2,
                "0"
            );


        document.getElementById(
            "art-id"
        ).textContent =
            `WORK ${workNumber}`;



        /* =====================================
           BASIC INFORMATION
        ===================================== */

        document.getElementById(
            "art-title"
        ).textContent =
            artwork.title || "";


        document.getElementById(
            "art-year"
        ).textContent =
            artwork.year || "—";


        document.getElementById(
            "art-medium"
        ).textContent =
            artwork.medium || "—";


        document.getElementById(
            "art-dimension"
        ).textContent =
            artwork.dimension || "—";



        /* =====================================
           LONG DESCRIPTION
        ===================================== */

        document.getElementById(
            "art-background"
        ).textContent =
            artwork.background || "";


        document.getElementById(
            "art-concept"
        ).textContent =
            artwork.concept || "";


        document.getElementById(
            "art-visual"
        ).textContent =
            artwork.visual_description || "";


        document.getElementById(
            "art-statement"
        ).textContent =
            artwork.artist_statement || "";


        document.getElementById(
            "art-inspiration"
        ).textContent =
            artwork.inspiration || "";


        document.getElementById(
            "art-process"
        ).textContent =
            artwork.creative_process || "";


    })


    /* =====================================
       DATABASE ERROR
    ===================================== */

    .catch(error => {


        console.error(
            "Error loading artwork:",
            error
        );


        const container =
            document.querySelector(
                ".artwork-container"
            );


        container.innerHTML = `

            <a
                href="index.html"
                class="back-button"
            >
                ← BACK
            </a>


            <p class="work-number">
                ARCHIVE ERROR
            </p>


            <h1 id="art-title">
                ARTWORK COULD NOT BE LOADED
            </h1>

        `;


    });


})();

</script>



<!-- =====================================
     NIRMUKA GLOBAL SYSTEM
     CURSOR / SPRAY / INTERACTION
===================================== -->

<script src="script.js"></script>



<!-- =====================================
     BACK TO PREVIOUS WORKS PAGE
===================================== -->

<script>

(function () {


    const backButton =
        document.getElementById(
            "artwork-back"
        );


    if (!backButton) {
        return;
    }


    backButton.addEventListener(
        "click",
        event => {


            /*
               Kalau pengunjung datang
               dari halaman WORKS,
               kembali ke halaman sebelumnya.
            */

            if (
                document.referrer &&
                document.referrer.includes(
                    window.location.hostname
                )
            ) {

                event.preventDefault();

                history.back();

            }

        }
    );


})();

</script>


</body>

</html>
