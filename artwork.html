<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <title>
        NIRMUKA | Artwork
    </title>



    <!-- =====================================
         MAIN CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="/style.css?v=20260822-9"
    >



    <!-- =====================================
         EMERGENCY DARK FALLBACK

         Kalau CSS GitHub Pages terlambat
         dimuat, halaman tidak akan menjadi putih.
    ====================================== -->

    <style>

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #050505;
            color: #ffffff;
        }


        .artwork-page {
            min-height: 100vh;
            background: #050505;
        }

    </style>


</head>



<body>



    <!-- =====================================
         ARTWORK DETAIL PAGE
    ====================================== -->

    <main class="artwork-page">


        <div class="artwork-container">



            <!-- =====================================
                 BACK
            ====================================== -->

            <a
                href="/"
                class="back-button"
                id="artwork-back"
            >
                ← BACK
            </a>



            <!-- =====================================
                 ARTWORK IMAGE
            ====================================== -->

            <div class="artwork-image">


                <img
                    id="art-image"
                    src=""
                    alt=""
                    draggable="false"
                >


            </div>



            <!-- =====================================
                 ARTWORK INFORMATION
            ====================================== -->

            <div class="artwork-info">



                <!-- TITLE -->

                <h1 id="art-title">
                    LOADING...
                </h1>



                <!-- META -->

                <div class="meta">


                    <div>

                        <strong>
                            YEAR
                        </strong>

                        <span id="art-year">
                            —
                        </span>

                    </div>



                    <div>

                        <strong>
                            MEDIUM
                        </strong>

                        <span id="art-medium">
                            —
                        </span>

                    </div>



                    <div>

                        <strong>
                            DIMENSION
                        </strong>

                        <span id="art-dimension">
                            —
                        </span>

                    </div>


                </div>



                <!-- =====================================
                     BACKGROUND
                ====================================== -->

                <div class="description-block">

                    <h2>
                        BACKGROUND
                    </h2>

                    <p id="art-background">
                        —
                    </p>

                </div>



                <!-- =====================================
                     CONCEPT
                ====================================== -->

                <div class="description-block">

                    <h2>
                        CONCEPT
                    </h2>

                    <p id="art-concept">
                        —
                    </p>

                </div>



                <!-- =====================================
                     VISUAL DESCRIPTION
                ====================================== -->

                <div class="description-block">

                    <h2>
                        VISUAL DESCRIPTION
                    </h2>

                    <p id="art-visual-description">
                        —
                    </p>

                </div>



                <!-- =====================================
                     ARTIST STATEMENT
                ====================================== -->

                <div class="description-block">

                    <h2>
                        ARTIST STATEMENT
                    </h2>

                    <p id="art-artist-statement">
                        —
                    </p>

                </div>



                <!-- =====================================
                     INSPIRATION
                ====================================== -->

                <div class="description-block">

                    <h2>
                        INSPIRATION
                    </h2>

                    <p id="art-inspiration">
                        —
                    </p>

                </div>



                <!-- =====================================
                     CREATIVE PROCESS
                ====================================== -->

                <div class="description-block">

                    <h2>
                        CREATIVE PROCESS
                    </h2>

                    <p id="art-creative-process">
                        —
                    </p>

                </div>


            </div>


        </div>


    </main>



    <!-- =====================================
         LOAD ARTWORK DATA
    ====================================== -->

    <script>

        /* =====================================
           GET ARTWORK ID FROM URL

           example:
           artwork.html?id=karya04
        ====================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const artworkId =
            params.get("id");



        /* =====================================
           DOM ELEMENTS
        ====================================== */

        const artworkImage =
            document.getElementById(
                "art-image"
            );


        const artworkTitle =
            document.getElementById(
                "art-title"
            );


        const artworkYear =
            document.getElementById(
                "art-year"
            );


        const artworkMedium =
            document.getElementById(
                "art-medium"
            );


        const artworkDimension =
            document.getElementById(
                "art-dimension"
            );


        const artworkBackground =
            document.getElementById(
                "art-background"
            );


        const artworkConcept =
            document.getElementById(
                "art-concept"
            );


        const artworkVisualDescription =
            document.getElementById(
                "art-visual-description"
            );


        const artworkArtistStatement =
            document.getElementById(
                "art-artist-statement"
            );


        const artworkInspiration =
            document.getElementById(
                "art-inspiration"
            );


        const artworkCreativeProcess =
            document.getElementById(
                "art-creative-process"
            );



        /* =====================================
           SAFE TEXT HELPER
        ====================================== */

        function setText(
            element,
            value
        ) {

            if (!element) {
                return;
            }


            element.textContent =
                value ||
                "—";

        }



        /* =====================================
           LOAD JSON
        ====================================== */

        fetch(
            "/artworks.json?v=20260822-8"
        )

        .then(response => {


            if (!response.ok) {

                throw new Error(
                    "artworks.json gagal dimuat"
                );

            }


            return response.json();

        })


        .then(artworks => {


            /* =================================
               FIND CURRENT ARTWORK
            ================================= */

            const artwork =
                artworks.find(
                    item =>
                        item.id ===
                        artworkId
                );



            /* =================================
               NOT FOUND
            ================================= */

            if (!artwork) {


                artworkTitle.textContent =
                    "ARTWORK NOT FOUND";


                artworkImage.style.display =
                    "none";


                return;

            }



            /* =================================
               PAGE TITLE
            ================================= */

            document.title =
                `${artwork.title} | NIRMUKA`;



            /* =================================
               IMAGE
            ================================= */

            const imagePath =
                artwork.image.startsWith("/")
                ?
                artwork.image
                :
                "/" + artwork.image;


            artworkImage.src =
                imagePath;


            artworkImage.alt =
                artwork.title;


            artworkImage.setAttribute(
                "draggable",
                "false"
            );



            /* =================================
               BASIC INFORMATION
            ================================= */

            setText(
                artworkTitle,
                artwork.title
            );


            setText(
                artworkYear,
                artwork.year
            );


            setText(
                artworkMedium,
                artwork.medium
            );


            setText(
                artworkDimension,
                artwork.dimension
            );



            /* =================================
               LONG TEXT
            ================================= */

            setText(
                artworkBackground,
                artwork.background
            );


            setText(
                artworkConcept,
                artwork.concept
            );


            setText(
                artworkVisualDescription,
                artwork.visual_description
            );


            setText(
                artworkArtistStatement,
                artwork.artist_statement
            );


            setText(
                artworkInspiration,
                artwork.inspiration
            );


            setText(
                artworkCreativeProcess,
                artwork.creative_process
            );


        })


        .catch(error => {


            console.error(
                "Artwork loading error:",
                error
            );


            artworkTitle.textContent =
                "ERROR LOADING ARTWORK";


            artworkImage.style.display =
                "none";


        });



        /* =====================================
           BACK BUTTON

           Kalau datang dari halaman NIRMUKA,
           kembali ke halaman sebelumnya.

           Kalau membuka URL secara langsung,
           kembali ke homepage.
        ====================================== */

        const artworkBack =
            document.getElementById(
                "artwork-back"
            );


        artworkBack.addEventListener(
            "click",
            event => {


                event.preventDefault();


                if (
                    document.referrer &&
                    new URL(
                        document.referrer
                    ).hostname ===
                    window.location.hostname
                ) {


                    history.back();


                }

                else {


                    window.location.href =
                        "/";


                }


            }
        );


    </script>



    <!-- =====================================
         GLOBAL NIRMUKA SYSTEM

         Includes:
         - spray nozzle
         - pilox
         - THOU SHALL NOT STEAL
    ====================================== -->

    <script
        src="/script.js?v=20260822-8"
    ></script>


</body>

</html>
