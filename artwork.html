<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NIRMUKA | Artwork</title>


    <!-- =====================================
         MAIN STYLESHEET
    ====================================== -->

    <link
        rel="stylesheet"
        href="/style.css?v=20260822-2"
    >


    <!-- =====================================
         DARK FALLBACK

         Kalau style.css terlambat/gagal dimuat,
         halaman TETAP hitam.
    ====================================== -->

    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            min-height: 100%;

            background: #050505;
            color: #ffffff;
        }


        body {
            min-height: 100vh;
        }


        .artwork-page {
            min-height: 100vh;
            background: #050505;
        }


        .artwork-container {
            position: relative;
            z-index: 2;
        }

    </style>

</head>


<body>


<!-- =====================================
     CURTAIN
===================================== -->

<div class="curtain"></div>



<!-- =====================================
     ARTWORK DETAIL PAGE
===================================== -->

<main class="artwork-page">


    <div class="artwork-container">


        <!-- =====================================
             BACK
        ====================================== -->

        <a
            href="/"
            class="back-button"
            id="artwork-back"
        >
            ← BACK TO WORKS
        </a>



        <!-- =====================================
             ARTWORK IMAGE
        ====================================== -->

        <div class="artwork-image">

            <img
                id="art-image"
                src=""
                alt="Artwork"
            >

        </div>



        <!-- =====================================
             ARTWORK INFORMATION
        ====================================== -->

        <div class="artwork-info">


            <p
                class="work-number"
                id="art-id"
            >
                WORK
            </p>



            <h1 id="art-title">
                Loading...
            </h1>



            <!-- =====================================
                 BASIC META
            ====================================== -->

            <div class="meta">


                <div>

                    <strong>
                        YEAR
                    </strong>

                    <span id="art-year">
                        —
                    </span>

                </div>


                <div>

                    <strong>
                        MEDIUM
                    </strong>

                    <span id="art-medium">
                        —
                    </span>

                </div>


                <div>

                    <strong>
                        DIMENSION
                    </strong>

                    <span id="art-dimension">
                        —
                    </span>

                </div>


            </div>



            <!-- =====================================
                 ARTWORK TEXT
            ====================================== -->

            <div class="description-block">


                <h2>
                    BACKGROUND
                </h2>

                <p id="art-background"></p>



                <h2>
                    CONCEPT
                </h2>

                <p id="art-concept"></p>



                <h2>
                    VISUAL DESCRIPTION
                </h2>

                <p id="art-visual"></p>



                <h2>
                    ARTIST STATEMENT
                </h2>

                <p id="art-statement"></p>



                <h2>
                    INSPIRATION
                </h2>

                <p id="art-inspiration"></p>



                <h2>
                    CREATIVE PROCESS
                </h2>

                <p id="art-process"></p>


            </div>


        </div>


    </div>


</main>



<!-- =====================================
     LOAD ARTWORK DATA
===================================== -->

<script>

(function () {


    /* =====================================
       READ ID FROM URL
    ====================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const artworkId =
        params.get("id");



    /* =====================================
       NO ID
    ====================================== */

    if (!artworkId) {

        showError(
            "ARTWORK NOT FOUND"
        );

        return;

    }



    /* =====================================
       LOAD ARTWORK DATABASE
    ====================================== */

    fetch(
        "/artworks.json?v=20260822-2"
    )

    .then(response => {


        if (!response.ok) {

            throw new Error(
                "Could not load artworks.json"
            );

        }


        return response.json();

    })

    .then(artworks => {


        const artwork =
            artworks.find(
                item =>
                    item.id === artworkId
            );


        if (!artwork) {

            showError(
                "ARTWORK NOT FOUND"
            );

            return;

        }


        renderArtwork(
            artwork
        );


    })

    .catch(error => {


        console.error(
            "NIRMUKA artwork error:",
            error
        );


        showError(
            "ARTWORK COULD NOT BE LOADED"
        );


    });



    /* =====================================
       RENDER ARTWORK
    ====================================== */

    function renderArtwork(
        artwork
    ) {


        /* browser title */

        document.title =
            `${artwork.title} | NIRMUKA`;



        /* IMAGE */

        const artworkImage =
            document.getElementById(
                "art-image"
            );


        if (artwork.image) {

            /*
               Images are stored
               in GitHub repository ROOT.
            */

            artworkImage.src =
                artwork.image.startsWith("/")
                    ? artwork.image
                    : "/" + artwork.image;


            artworkImage.alt =
                artwork.title || "Artwork";


            artworkImage.onerror =
                function () {

                    console.error(
                        "Artwork image failed:",
                        artwork.image
                    );

                    this.style.display =
                        "none";

                };

        }

        else {

            artworkImage.style.display =
                "none";

        }



        /* WORK NUMBER */

        let workNumber =
            String(
                artwork.id || ""
            ).replace(
                "karya",
                ""
            );


        workNumber =
            workNumber.padStart(
                2,
                "0"
            );


        setText(
            "art-id",
            `WORK ${workNumber}`
        );



        /* BASIC DATA */

        setText(
            "art-title",
            artwork.title || "UNTITLED"
        );


        setText(
            "art-year",
            artwork.year || "—"
        );


        setText(
            "art-medium",
            artwork.medium || "—"
        );


        setText(
            "art-dimension",
            artwork.dimension || "—"
        );



        /* LONG TEXT */

        setText(
            "art-background",
            artwork.background || ""
        );


        setText(
            "art-concept",
            artwork.concept || ""
        );


        setText(
            "art-visual",
            artwork.visual_description || ""
        );


        setText(
            "art-statement",
            artwork.artist_statement || ""
        );


        setText(
            "art-inspiration",
            artwork.inspiration || ""
        );


        setText(
            "art-process",
            artwork.creative_process || ""
        );


    }



    /* =====================================
       SAFE TEXT SETTER
    ====================================== */

    function setText(
        id,
        value
    ) {

        const element =
            document.getElementById(
                id
            );


        if (element) {

            element.textContent =
                value;

        }

    }



    /* =====================================
       ERROR PAGE
    ====================================== */

    function showError(
        message
    ) {

        const container =
            document.querySelector(
                ".artwork-container"
            );


        if (!container) {
            return;
        }


        container.innerHTML = `

            <a
                href="/"
                class="back-button"
            >
                ← BACK
            </a>


            <p class="work-number">
                NIRMUKA / ARCHIVE ERROR
            </p>


            <h1 id="art-title">
                ${message}
            </h1>

        `;

    }


})();

</script>



<!-- =====================================
     GLOBAL NIRMUKA SYSTEM

     Loads:
     - spray nozzle
     - spray paint
     - interaction system

     script.js is designed so that
     missing landing/menu elements
     do not break artwork.html.
===================================== -->

<script src="/script.js?v=20260822-2"></script>



<!-- =====================================
     BACK TO WORKS
===================================== -->

<script>

(function () {


    const backButton =
        document.getElementById(
            "artwork-back"
        );


    if (!backButton) {
        return;
    }


    backButton.addEventListener(
        "click",
        function (event) {


            /*
               Jika user datang dari
               halaman NIRMUKA sendiri,
               gunakan browser history.

               Ini memungkinkan user kembali
               ke daftar WORKS sebelumnya.
            */


            if (
                document.referrer &&
                document.referrer.includes(
                    window.location.hostname
                )
            ) {

                event.preventDefault();

                window.history.back();

            }


        }
    );


})();

</script>


</body>

</html>
